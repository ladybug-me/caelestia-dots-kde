name: Bug report
description: Something's not working right
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        A quick search of [existing issues](https://github.com/ladybug-me/caelestia-dots-kde/issues?q=is%3Aissue) helps avoid duplicates - if you find one, give it a thumbs up instead.

  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong? What did you expect instead?
      placeholder: |
        The launcher froze when I typed "terminal" and pressed Enter. I expected it to open Konsole.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1. Open the launcher (Super+Space)
        2. Type "terminal"
        3. Press Enter
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: Distro, Plasma version, anything that helps narrow it down.
      placeholder: |
        - Distro: CachyOS
        - Plasma: 6.3
        - Installed via: setup.sh
      render: markdown
    validations:
      required: false

  - type: textarea
    attributes:
      label: Logs or screenshots
      description: |
        If relevant, paste logs or drag in screenshots. The `caelestia-shell-ipc log` command shows live shell logs.
      placeholder: Drag and drop images here, or paste log output.
    validations:
      required: false
