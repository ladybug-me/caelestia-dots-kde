name: Validate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: Python quality - lint, compile, best practices
  # ═══════════════════════════════════════════════════════════
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install lint tools
        run: pip install flake8

      - name: Python compile check
        run: |
          echo "::group::Python compile check"
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/__pycache__/*' \
            -print0 | xargs -0 -n1 python3 -m py_compile
          echo "::endgroup::"

      - name: flake8 lint
        run: |
          echo "::group::flake8"
          # Only check our own Python scripts, not vendored/pre-existing ones
          # (shell/scripts holds the QML linter and other repo tooling).
          flake8 .github/scripts/ shell/scripts/ \
            --exclude 'orion_search.py,menu_perf_stats.py' \
            --max-line-length=120 \
            --extend-ignore=E402,W503,E501,E203 \
            --count \
            --show-source \
            --statistics
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════
  # Job 2: Repository integrity - cross-cutting consistency checks
  # ═══════════════════════════════════════════════════════════
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run repository integrity tests
        run: python3 .github/scripts/test_repo_integrity.py

  # ═══════════════════════════════════════════════════════════
  # Job 3: JSON configuration validation
  # ═══════════════════════════════════════════════════════════
  json-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate theme.json and menu.json
        run: python3 .github/scripts/validate_json_configs.py

  # ═══════════════════════════════════════════════════════════
  # Installer Go - build, vet, and test the Bubble Tea TUI
  # ═══════════════════════════════════════════════════════════
  installer-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Build
        run: CGO_ENABLED=0 go build -mod=vendor ./...

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Test
        run: go test -mod=vendor ./...

  # ═══════════════════════════════════════════════════════════
  # Job 4: File hygiene - large files, whitespace, merge conflicts
  # ═══════════════════════════════════════════════════════════
  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run file hygiene checks
        # PRs: only files changed in this PR (hard). Pushes to main/dev: full
        # repo scan (report-only — there is pre-existing debt that would fail
        # a hard gate, but the log surfaces it for cleanup).
        run: python3 .github/scripts/check_file_hygiene.py ${{ github.event_name == 'push' && '--all' || '' }}
        continue-on-error: ${{ github.event_name == 'push' }}

  # ═══════════════════════════════════════════════════════════
  # Job 5: Markdown lint
  # ═══════════════════════════════════════════════════════════
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        continue-on-error: true
        with:
          globs: |
            docs/**/*.md
            .github/*.md
            .github/CONTRIBUTING.md

  # ═══════════════════════════════════════════════════════════
  # Job 6: QML conventions - project linter regression gate
  # ═══════════════════════════════════════════════════════════
  # shell/scripts/qml-lint-conventions.py has thousands of pre-existing
  # violations, so this job diffs against a stored baseline and fails only when
  # NEW violations appear. Regenerate with --update when intentional.
  qml-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run QML convention regression check
        run: python3 .github/scripts/check_qml_conventions.py

  # ═══════════════════════════════════════════════════════════
  # Job 7: QML structural syntax - brace balance + top-level component
  # ═══════════════════════════════════════════════════════════
  # A QML syntax error (an inline `component` declared at the top level, or an
  # unbalanced brace) makes the whole shell fail to load, and the error
  # cascades through the module tree so the reported file is not the real
  # cause. qmllint can't resolve Quickshell's qs.* imports, so this does a
  # lightweight structural parse instead.
  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check QML structural syntax
        run: python3 .github/scripts/check_qml_syntax.py --source-root shell

  # ═══════════════════════════════════════════════════════════
  # Job 8: Embedded bash - syntax-check bash/sh inside QML Process commands
  # ═══════════════════════════════════════════════════════════
  # Quickshell runs `command: ["bash", "-c", `<script>`]` strings that qmllint
  # and shellcheck never see; a typo there only surfaces at runtime.
  embedded-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check bash/sh scripts embedded in QML
        run: python3 .github/scripts/check_embedded_bash.py

  # ═══════════════════════════════════════════════════════════
  # Job 9: Config cross-reference - QML config keys vs C++ declarations
  # ═══════════════════════════════════════════════════════════
  # Catches Config./GlobalConfig. references that don't exist in the plugin's
  # CONFIG_PROPERTY declarations (renamed keys, typos) - the shell logs
  # "Cannot assign to non-existent property" and the widget silently breaks.
  config-cross-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cross-check QML config references against C++ declarations
        run: python3 .github/scripts/check_config_references.py

  # ═══════════════════════════════════════════════════════════
  # Job 10: actionlint - validate workflow files themselves
  # ═══════════════════════════════════════════════════════════
  # Catches malformed ${{ }} expressions, bad `on:` keys, wrong permission
  # scopes, etc. that a plain YAML parse cannot.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download actionlint
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -shellcheck= -color -ignore 'missing input "app-id"' -ignore 'input "client-id" is not defined'

  # ═══════════════════════════════════════════════════════════
  # Job 10: Wayland static lifetime - catch exit-time SIGSEGVs
  # ═══════════════════════════════════════════════════════════
  # A class inheriting QWaylandClientExtensionTemplate<T> or QtWayland::* owns
  # a live wl_proxy. Holding one as a function-local (or other) static by
  # value tears it down from an exit handler after Qt's closed the display,
  # which segfaults the shell on quit - see windowscreencast.cpp/plasmawindows.cpp
  # for the fix pattern (leak the pointer instead).
  wayland-static-lifetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for value-typed statics of Wayland proxy-wrapping types
        run: python3 .github/scripts/check_wayland_static_lifetime.py

  # ═══════════════════════════════════════════════════════════
  # Job 11: QML import completeness - missing/extra imports
  # ═══════════════════════════════════════════════════════════
  # No real Qt/QML toolchain is available here (qmllint6 can't resolve this
  # repo's qs.* directory-import convention at all), and no other job ever
  # loads the QML engine - see check_qml_imports.py's module docstring for
  # the exact/correlation registry design. This is what would have caught
  # Nmcli.qml shipping without `import Quickshell` ("Singleton is not a
  # type", cascading into "Type X unavailable" for every transitive importer).
  qml-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check QML import completeness
        run: python3 .github/scripts/check_qml_imports.py --shell-root shell

  # ═══════════════════════════════════════════════════════════
  # Job 12: QML template interpolation - unescaped bash ${...}
  # ═══════════════════════════════════════════════════════════
  # Bash embedded in QML backtick template literals must escape `${` as
  # `\${`; an unescaped `${1#v}` is parsed as JavaScript and fails with
  # "Expected token ','", which then cascades into "Type X unavailable" for
  # every transitive importer (see shell/services/UpdateChecker.qml).
  qml-template-interp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for unescaped bash interpolation in QML template literals
        run: python3 .github/scripts/check_qml_template_interp.py

  # ═══════════════════════════════════════════════════════════
  # Final gate: require all non-skippable jobs to pass
  # ═══════════════════════════════════════════════════════════
  validate-gate:
    needs:
      - python-quality
      - repo-integrity
      - json-validation
      - file-hygiene
      - markdown-lint
      - qml-conventions
      - embedded-bash
      - config-cross-ref
      - actionlint
      - wayland-static-lifetime
      - qml-imports
      - qml-template-interp
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## Validate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A job_results
          job_results[python-quality]="${{ needs.python-quality.result }}"
          job_results[repo-integrity]="${{ needs.repo-integrity.result }}"
          job_results[json-validation]="${{ needs.json-validation.result }}"
          job_results[file-hygiene]="${{ needs.file-hygiene.result }}"
          job_results[markdown-lint]="${{ needs.markdown-lint.result }}"
          job_results[qml-conventions]="${{ needs.qml-conventions.result }}"
          job_results[embedded-bash]="${{ needs.embedded-bash.result }}"
          job_results[config-cross-ref]="${{ needs.config-cross-ref.result }}"
          job_results[actionlint]="${{ needs.actionlint.result }}"
          job_results[wayland-static-lifetime]="${{ needs.wayland-static-lifetime.result }}"
          job_results[qml-imports]="${{ needs.qml-imports.result }}"
          job_results[qml-template-interp]="${{ needs.qml-template-interp.result }}"

          all_passed=true
          for job in "${!job_results[@]}"; do
            result="${job_results[$job]}"
            if [[ "$result" == "success" ]]; then
              echo "- [PASS] **${job}**" >> $GITHUB_STEP_SUMMARY
            elif [[ "$result" == "skipped" ]]; then
              echo "- [SKIP] **${job}**" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [FAIL] **${job}** - ${result}" >> $GITHUB_STEP_SUMMARY
              all_passed=false
            fi
          done

          if [[ "$all_passed" != "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

