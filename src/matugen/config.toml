# Matugen wiring for the Caelestia shell.
#
# Verified on matugen 4.2.0: this config renders src/matugen/scheme.json.tmpl end
# to end. The invocation the command will use is
#
#   matugen image <wallpaper> --config <this file> --source-color-index 0 \
#       --mode <light|dark> --type <scheme-*> --import-json-string \
#       '{"name":"dynamic","flavour":"default","variant":"<variant>"}'
#
# `name`, `flavour` and `variant` come from that imported string, because matugen
# has no keyword for them. `mode` is matugen's own keyword. `--source-color-index 0`
# picks the most dominant color instead of prompting, which matters because the
# command runs without a terminal.

[config]
# Desired contrast. 0 is the Material spec; the shell has no contrast setting of
# its own, so this stays at the spec until it does.
contrast = 0.0

[templates.scheme]
input_path = "./scheme.json.tmpl"

# The state file the shell watches. Relative paths resolve from this file, so the
# command either rewrites this line with an absolute path or passes `--config`
# with a generated copy.
output_path = "caelestia/scheme.json"

# The palette the shell is built around, and the only one the UI offers.
type = "SchemeTonalSpot"

# Runs per generation, after the file lands, so the shell picks it up without a
# restart even if it is watching the directory rather than the file.
post_hook = "true"
